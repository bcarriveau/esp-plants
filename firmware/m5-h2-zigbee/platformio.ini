[platformio]
default_envs = m5_gateway_h2
packages_dir = .pio-packages

[env:m5_gateway_h2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-h2-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_echo = yes
upload_speed = 460800
board_build.flash_size = 2MB
board_build.cdc_on_boot = 1
board_upload.flash_size = 2MB
board_upload.maximum_size = 2097152
board_build.partitions = partitions.csv
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DZIGBEE_MODE_ZCZR
  -DCORE_DEBUG_LEVEL=3
  -DESP_PLANTS_H2_DEV_DIAGNOSTICS=1
  -I ../../shared/plantlink
  -I ../../shared/zg303z
  -I include

[env:m5_gateway_h2_release]
extends = env:m5_gateway_h2
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DZIGBEE_MODE_ZCZR
  -DCORE_DEBUG_LEVEL=0
  -DESP_PLANTS_DISTRIBUTION_BUILD=1
  -I ../../shared/plantlink
  -I ../../shared/zg303z
  -I include
