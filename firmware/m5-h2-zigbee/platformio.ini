[platformio]
default_envs = m5_gateway_h2
packages_dir = .pio-packages

[env:m5_gateway_h2]
; Reuse the same current pioarduino generation already used by ESP PLANTS XIAO.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-h2-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed = 460800

; The M5Stack Unit Gateway H2 is ESP32-H2-MINI-1-N2: 2 MB flash.
board_build.flash_size = 2MB
board_build.cdc_on_boot = 1
board_upload.flash_size = 2MB
board_upload.maximum_size = 2097152
board_build.partitions = partitions.csv

build_flags =
  -DZIGBEE_MODE_ZCZR
  -DCORE_DEBUG_LEVEL=3
  -I ../../shared/plantlink
  -I ../../shared/zg303z
