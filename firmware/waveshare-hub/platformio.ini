[platformio]
default_envs = waveshare_s3_touch_lcd_7
packages_dir = .pio-packages

[env:waveshare_s3_touch_lcd_7]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts =
  pre:scripts/phase2_inject.py
  pre:scripts/alpha22_phrases_inject.py
  pre:scripts/alpha23_mixed_theme_inject.py
  pre:scripts/alpha24_personality_ui_inject.py
  pre:scripts/alpha25_personality_boot_fix.py
  pre:scripts/alpha26_personality_page_fix.py
  pre:scripts/alpha27_personality_zero_alloc_fix.py
  pre:scripts/alpha28_personality_polish.py
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_port = COM11
upload_speed = 921600
platform_packages =
  platformio/framework-arduinoespressif32-libs@https://dl.espressif.com/AE/esp-arduino-libs/esp32-3.0.7-h.zip
board_build.flash_size = 16MB
board_build.cdc_on_boot = 1
board_build.usb_mode = 1
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = partitions/esp_plants_16MB.csv
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DLV_CONF_INCLUDE_SIMPLE
  -DESP_PANEL_CUSTOM_BOARD_PATH=waveshare_panel_board.h
  -I include
  -I ../../shared/plantlink
  -Wl,--wrap=_Z4loopv
  -Wl,--wrap=lvgl_port_lock
  -Wl,--wrap=lvgl_port_unlock
  -Wl,--wrap=lv_timer_handler
  -Wl,--wrap=_ZN16espplants_update7serviceEv
lib_deps =
  https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v0.1.4
  https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v0.0.3
  lvgl/lvgl@8.3.11
  bblanchon/ArduinoJson@7.3.1

[env:waveshare_s3_touch_lcd_7_release]
extends = env:waveshare_s3_touch_lcd_7
extra_scripts =
  ${env:waveshare_s3_touch_lcd_7.extra_scripts}
  post:scripts/build_plants_ota.py
build_flags =
  ${env:waveshare_s3_touch_lcd_7.build_flags}
  -DESP_PLANTS_DISTRIBUTION_BUILD=1
