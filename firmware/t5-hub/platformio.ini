[platformio]
default_envs = t5_pro_receiver
packages_dir = .pio-packages
boards_dir = boards

[env:t5_pro_receiver]
; Restore the exact ESP32 platform generation used by the hardware-proven
; ESP-PLANTS-T5-DISPLAY-TEST10 true-off baseline.
platform = espressif32@6.13.0
board = T5-ePaper-S3
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    m5stack/M5GFX@0.2.24
